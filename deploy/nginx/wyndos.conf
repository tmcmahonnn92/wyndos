# Two copies of the app (deploy/setup-zero-downtime.sh puts this in conf.d on the VPS).
upstream wyndos_app {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3002 max_fails=1 fail_timeout=5s;
}

# Backstop against floods. The app also limits logins, sign-ups and resets itself.
limit_req_zone $binary_remote_addr zone=wyndos_req:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    client_max_body_size 10m;
    server_tokens off;

    location /api/health {
        proxy_pass http://wyndos_app/api/health;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every build's JS/CSS (see deploy/setup-zero-downtime.sh for the snippet).
    include snippets/wyndos-static.conf;

    location / {
        limit_req zone=wyndos_req burst=80 nodelay;
        proxy_pass http://wyndos_app;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
