# Staging: a private test copy of Wyndos at staging.wyndos.io.
# Password protected so only you can see it, and hidden from search engines.
# Run certbot on this file after copying it (see deploy/STAGING.md).
server {
    listen 80;
    listen [::]:80;
    server_name staging.wyndos.io;

    client_max_body_size 10m;

    auth_basic "Wyndos staging";
    auth_basic_user_file /etc/nginx/wyndos-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
